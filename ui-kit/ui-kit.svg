<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <!--
    ui-kit 矢量精灵（诡秘之主 / 卡牌游戏风格）
    徽记画法权威源：assets/frames/TAROT_SYMBOLS.md（罗塞尔亵渎之牌体系，22 途径）
    图标统一 stroke=currentColor / fill=none，颜色由 CSS 的 color 控制（可主题化）。
    用法： <svg class="cg-ico"><use href="#cg-xxx"/></svg>
  -->
  <defs>
    <!-- 黄铜描边通用样式，矢量图均继承 -->
    <style>
      .cg-sprite use, .cg-sprite path, .cg-sprite circle, .cg-sprite line {
        stroke-linecap: round; stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- 关闭（X） -->
  <symbol id="cg-close" viewBox="0 0 24 24">
    <line x1="6" y1="6" x2="18" y2="18"/>
    <line x1="18" y1="6" x2="6" y2="18"/>
  </symbol>

  <!-- 返回（左箭头 / chevron） -->
  <symbol id="cg-back" viewBox="0 0 24 24">
    <path d="M15 5 L8 12 L15 19"/>
  </symbol>

  <!-- 选中（对勾） -->
  <symbol id="cg-check" viewBox="0 0 24 24">
    <path d="M5 12.5 L10 17.5 L19 6.5"/>
  </symbol>

  <!-- 下拉（chevron-down） -->
  <symbol id="cg-chevron" viewBox="0 0 24 24">
    <path d="M6 9 L12 15 L18 9"/>
  </symbol>

  <!-- 设置（齿轮简化） -->
  <symbol id="cg-cog" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9 19 19M19 5l-2.1 2.1M7.1 16.9 5 19"/>
  </symbol>

  <!-- 星星 / 不眠者（八芒星） -->
  <symbol id="cg-sigil-star" viewBox="0 0 24 24">
    <path d="M12 2 L13.6 10.4 L22 12 L13.6 13.6 L12 22 L10.4 13.6 L2 12 L10.4 10.4 Z"/>
    <circle cx="12" cy="12" r="2.4" fill="none"/>
  </symbol>

  <!-- 月亮 / 药师（弯月） -->
  <symbol id="cg-sigil-moon" viewBox="0 0 24 24">
    <path d="M15.5 4.5 A9 9 0 1 0 19.5 17 A7 7 0 0 1 15.5 4.5 Z"/>
  </symbol>

  <!-- 太阳 / 歌颂者（圆 + 光芒） -->
  <symbol id="cg-sigil-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.4 4.4l2.1 2.1M17.5 17.5l2.1 2.1M19.6 4.4l-2.1 2.1M6.5 17.5l-2.1 2.1"/>
  </symbol>

  <!-- 命运之轮 / 怪物（八辐轮） -->
  <symbol id="cg-sigil-wheel" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6L6 18"/>
  </symbol>

  <!-- 隐者 / 窥秘人（圆内六角星 = 灯） -->
  <symbol id="cg-sigil-hermit" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 5 L17 8.5 L17 15.5 L12 19 L7 15.5 L7 8.5 Z"/>
    <path d="M12 19 L7 8.5 L17 8.5 Z"/>
  </symbol>

  <!-- 愚者 / 占卜家（圆 + 斜穿手杖） -->
  <symbol id="cg-sigil-fool" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M5 19 L19 5"/>
    <path d="M18 4.5 l1.2 1.2 -2.4 .2 Z" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 塔 / 阅读者（高塔 + 之字闪电） -->
  <symbol id="cg-sigil-tower" viewBox="0 0 24 24">
    <path d="M9 21 V8 H15 V21"/>
    <path d="M12 2 L9.5 7 L12.5 9 L10 14"/>
  </symbol>

  <!-- 魔术师 / 学徒（∞ 双环） -->
  <symbol id="cg-sigil-magician" viewBox="0 0 24 24">
    <circle cx="8.2" cy="12" r="4.2"/>
    <circle cx="15.8" cy="12" r="4.2"/>
  </symbol>

  <!-- 女祭司 / 通识者（两竖柱 + 其间小新月） -->
  <symbol id="cg-sigil-priestess" viewBox="0 0 24 24">
    <path d="M5.5 4v16M18.5 4v16"/>
    <path d="M13.6 8.2 A4.6 4.6 0 1 0 15.4 14.6 A3.6 3.6 0 0 1 13.6 8.2 Z"/>
  </symbol>

  <!-- 女皇 / 刺客（♀ 金星） -->
  <symbol id="cg-sigil-empress" viewBox="0 0 24 24">
    <circle cx="12" cy="9" r="5"/>
    <path d="M12 14v7M8.5 18h7"/>
  </symbol>

  <!-- 皇帝 / 律师（三尖王冠） -->
  <symbol id="cg-sigil-emperor" viewBox="0 0 24 24">
    <path d="M4 16 L4 8 L9 12 L12 5.5 L15 12 L20 8 L20 16 Z"/>
    <path d="M4 19.5h16"/>
  </symbol>

  <!-- 教皇 / 水手（交叉双钥） -->
  <symbol id="cg-sigil-hierophant" viewBox="0 0 24 24">
    <circle cx="6.4" cy="6.4" r="2.4"/>
    <circle cx="17.6" cy="6.4" r="2.4"/>
    <path d="M8 8.2 L18 20M16 8.2 L6 20"/>
  </symbol>

  <!-- 恋人 / 偷盗者（两相交圆 · vesica） -->
  <symbol id="cg-sigil-lovers" viewBox="0 0 24 24">
    <circle cx="9" cy="12" r="5.2"/>
    <circle cx="15" cy="12" r="5.2"/>
  </symbol>

  <!-- 战车 / 猎人（方块车体 + 上方四角星） -->
  <symbol id="cg-sigil-chariot" viewBox="0 0 24 24">
    <path d="M12 2.2 L13.1 5.6 L16.5 6.7 L13.1 7.8 L12 11.2 L10.9 7.8 L7.5 6.7 L10.9 5.6 Z"/>
    <path d="M5.5 12.5 H18.5 V21 H5.5 Z"/>
  </symbol>

  <!-- 力量 / 战士（∞ + 下方放射小圆 = 狮鬃） -->
  <symbol id="cg-sigil-strength" viewBox="0 0 24 24">
    <circle cx="9" cy="7.5" r="3.2"/>
    <circle cx="15" cy="7.5" r="3.2"/>
    <circle cx="12" cy="16.5" r="2.2"/>
    <path d="M12 20.5v1.8M6.8 16.5H5M19 16.5h-1.8M8.4 19.7l-1.3 1.3M15.6 19.7l1.3 1.3"/>
  </symbol>

  <!-- 正义 / 观众（天平：立柱 + 梁 + 两盘） -->
  <symbol id="cg-sigil-justice" viewBox="0 0 24 24">
    <path d="M12 3.5v15M9 21h6M4.5 7h15"/>
    <path d="M4.5 7 L2 13.2 A2.6 2.6 0 0 0 7 13.2 Z"/>
    <path d="M19.5 7 L17 13.2 A2.6 2.6 0 0 0 22 13.2 Z"/>
  </symbol>

  <!-- 倒吊人 / 秘祈人（T 形横梁 + 下端悬头） -->
  <symbol id="cg-sigil-hanged" viewBox="0 0 24 24">
    <path d="M4 4.5h16M12 4.5v8.5"/>
    <circle cx="12" cy="16.5" r="3.6"/>
  </symbol>

  <!-- 死神 / 收尸人（镰刀） -->
  <symbol id="cg-sigil-death" viewBox="0 0 24 24">
    <path d="M9.5 3v18"/>
    <path d="M9.5 3.8 C15.5 4.2 19 7.8 19.4 12.6 C15 11 11.5 9 9.5 7 Z"/>
  </symbol>

  <!-- 节制 / 囚犯（方形内三角） -->
  <symbol id="cg-sigil-temperance" viewBox="0 0 24 24">
    <path d="M5 5 H19 V19 H5 Z"/>
    <path d="M12 8.6 L16.6 16 H7.4 Z"/>
  </symbol>

  <!-- 恶魔 / 罪犯（倒五芒星，尖朝下） -->
  <symbol id="cg-sigil-devil" viewBox="0 0 24 24">
    <path d="M12 20 L7.3 5.5 L19.6 14.5 L4.4 14.5 L16.7 5.5 Z"/>
  </symbol>

  <!-- 审判 / 仲裁人（号角 + 两道声波弧） -->
  <symbol id="cg-sigil-judgement" viewBox="0 0 24 24">
    <path d="M3 9.5 L11 11.3 L11 12.7 L3 14.5 Z"/>
    <path d="M11 12h4"/>
    <path d="M16.5 8.5 a5.5 5.5 0 0 1 0 7M19 6 a9.5 9.5 0 0 1 0 12"/>
  </symbol>

  <!-- 世界 / 耕种者（桂冠环 + 中央菱种） -->
  <symbol id="cg-sigil-world" viewBox="0 0 24 24">
    <ellipse cx="12" cy="12" rx="6.8" ry="9"/>
    <path d="M12 7.5 L14.8 12 L12 16.5 L9.2 12 Z"/>
  </symbol>

  <!-- 角饰（卡框 / 头像框四角的卷草） -->
  <symbol id="cg-flourish" viewBox="0 0 40 40">
    <path d="M3 37 C3 20 14 6 37 3" fill="none"/>
    <path d="M3 29 C3 18 10 9 23 6" fill="none" opacity="0.6"/>
    <circle cx="5" cy="35" r="1.6" fill="currentColor" stroke="none"/>
    <circle cx="37" cy="3" r="1.8" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 暗雾神秘几何（背景平铺母题：同心环 + 刻度 + 八芒微光） -->
  <symbol id="cg-arcane" viewBox="0 0 160 160">
    <g fill="none" stroke="currentColor">
      <circle cx="80" cy="80" r="58"/>
      <circle cx="80" cy="80" r="46" opacity="0.5"/>
      <circle cx="80" cy="80" r="6" opacity="0.7"/>
      <!-- 外圈刻度 -->
      <g opacity="0.55">
        <path d="M80 18 v8 M80 134 v8 M18 80 h8 M134 80 h8
                 M36 36 l5.5 5.5 M124 36 l-5.5 5.5 M36 124 l5.5 -5.5 M124 124 l-5.5 -5.5"/>
      </g>
      <!-- 八芒微光 -->
      <path d="M80 40 L84 76 L120 80 L84 84 L80 120 L76 84 L40 80 L76 76 Z" opacity="0.35"/>
    </g>
  </symbol>
</svg>
