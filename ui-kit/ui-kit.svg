<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <!--
    ui-kit 矢量精灵（诡秘之主 / 卡牌游戏风格）
    徽记画法权威源：assets/frames/TAROT_SYMBOLS.md（罗塞尔亵渎之牌体系，22 途径）
    图标统一 stroke=currentColor / fill=none，颜色由 CSS 的 color 控制（可主题化）。
    用法： <svg class="cg-ico"><use href="#cg-xxx"/></svg>
  -->
  <defs>
    <!-- 黄铜描边通用样式，矢量图均继承 -->
    <style>
      .cg-sprite use, .cg-sprite path, .cg-sprite circle, .cg-sprite line {
        stroke-linecap: round; stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- 关闭（X） -->
  <symbol id="cg-close" viewBox="0 0 24 24">
    <line x1="6" y1="6" x2="18" y2="18"/>
    <line x1="18" y1="6" x2="6" y2="18"/>
  </symbol>

  <!-- 返回（左箭头 / chevron） -->
  <symbol id="cg-back" viewBox="0 0 24 24">
    <path d="M15 5 L8 12 L15 19"/>
  </symbol>

  <!-- 选中（对勾） -->
  <symbol id="cg-check" viewBox="0 0 24 24">
    <path d="M5 12.5 L10 17.5 L19 6.5"/>
  </symbol>

  <!-- 下拉（chevron-down） -->
  <symbol id="cg-chevron" viewBox="0 0 24 24">
    <path d="M6 9 L12 15 L18 9"/>
  </symbol>

  <!-- 设置（齿轮简化） -->
  <symbol id="cg-cog" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9 19 19M19 5l-2.1 2.1M7.1 16.9 5 19"/>
  </symbol>

  <!-- 星星 / 不眠者（八芒星） -->
  <symbol id="cg-sigil-star" viewBox="0 0 24 24">
    <path d="M12 2 L13.6 10.4 L22 12 L13.6 13.6 L12 22 L10.4 13.6 L2 12 L10.4 10.4 Z"/>
    <circle cx="12" cy="12" r="2.4" fill="none"/>
  </symbol>

  <!-- 月亮 / 药师（弯月） -->
  <symbol id="cg-sigil-moon" viewBox="0 0 24 24">
    <path d="M15.5 4.5 A9 9 0 1 0 19.5 17 A7 7 0 0 1 15.5 4.5 Z"/>
  </symbol>

  <!-- 太阳 / 歌颂者（圆 + 光芒） -->
  <symbol id="cg-sigil-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.4 4.4l2.1 2.1M17.5 17.5l2.1 2.1M19.6 4.4l-2.1 2.1M6.5 17.5l-2.1 2.1"/>
  </symbol>

  <!-- 命运之轮 / 怪物（八辐轮） -->
  <symbol id="cg-sigil-wheel" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6L6 18"/>
  </symbol>

  <!-- 隐者 / 窥秘人（圆内六角星 = 灯） -->
  <symbol id="cg-sigil-hermit" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 5 L17 8.5 L17 15.5 L12 19 L7 15.5 L7 8.5 Z"/>
    <path d="M12 19 L7 8.5 L17 8.5 Z"/>
  </symbol>

  <!-- 愚者 / 占卜家（圆 + 斜穿手杖） -->
  <symbol id="cg-sigil-fool" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M5 19 L19 5"/>
    <path d="M18 4.5 l1.2 1.2 -2.4 .2 Z" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 塔 / 阅读者（高塔 + 之字闪电） -->
  <symbol id="cg-sigil-tower" viewBox="0 0 24 24">
    <path d="M9 21 V8 H15 V21"/>
    <path d="M12 2 L9.5 7 L12.5 9 L10 14"/>
  </symbol>

  <!-- 角饰（卡框 / 头像框四角的卷草） -->
  <symbol id="cg-flourish" viewBox="0 0 40 40">
    <path d="M3 37 C3 20 14 6 37 3" fill="none"/>
    <path d="M3 29 C3 18 10 9 23 6" fill="none" opacity="0.6"/>
    <circle cx="5" cy="35" r="1.6" fill="currentColor" stroke="none"/>
    <circle cx="37" cy="3" r="1.8" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 暗雾神秘几何（背景平铺母题：同心环 + 刻度 + 八芒微光） -->
  <symbol id="cg-arcane" viewBox="0 0 160 160">
    <g fill="none" stroke="currentColor">
      <circle cx="80" cy="80" r="58"/>
      <circle cx="80" cy="80" r="46" opacity="0.5"/>
      <circle cx="80" cy="80" r="6" opacity="0.7"/>
      <!-- 外圈刻度 -->
      <g opacity="0.55">
        <path d="M80 18 v8 M80 134 v8 M18 80 h8 M134 80 h8
                 M36 36 l5.5 5.5 M124 36 l-5.5 5.5 M36 124 l5.5 -5.5 M124 124 l-5.5 -5.5"/>
      </g>
      <!-- 八芒微光 -->
      <path d="M80 40 L84 76 L120 80 L84 84 L80 120 L76 84 L40 80 L76 76 Z" opacity="0.35"/>
    </g>
  </symbol>
</svg>
